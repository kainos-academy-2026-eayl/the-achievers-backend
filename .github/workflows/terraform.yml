name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "my-infrastructure/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "my-infrastructure/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform (dev)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-infrastructure

    env:
      ENVIRONMENT: dev
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="environments/${ENVIRONMENT}.backend.hcl"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

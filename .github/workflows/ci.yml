name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'publish-image'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-123456

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

  docker:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/the-achievers-backend
      PUSH: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'publish-image') }}
      EXTRA_TAG: ${{ github.event_name == 'push' && 'latest' || format('pr-{0}', github.event.pull_request.number) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Log in to Azure
        if: env.PUSH == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        if: env.PUSH == 'true'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker tag $IMAGE:${{ github.sha }} $IMAGE:$EXTRA_TAG
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:$EXTRA_TAG
  
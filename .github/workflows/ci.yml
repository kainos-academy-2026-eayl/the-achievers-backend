name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# Queue main runs so a saved Terraform plan can't go stale before it's applied;
# cancel superseded runs on PR branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TF_ENVIRONMENT: dev

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-123456

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

  terraform-plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    # Waits for the frontend build to learn its commit SHA. That job is skipped
    # on fork PRs, which only need fmt/validate here.
    needs: [checks, build-frontend-image]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.build-frontend-image.result != 'failure' }}
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-dev
      cancel-in-progress: false
      queue: max

    defaults:
      run:
        working-directory: my-infrastructure

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (validation only)
        run: terraform init -input=false -backend=false

      - name: Validate
        run: terraform validate

      - name: Init backend
        id: backend_init
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]' &&
           env.ARM_CLIENT_ID != '' &&
           env.ARM_TENANT_ID != '' &&
           env.ARM_SUBSCRIPTION_ID != '')
        run: terraform init -input=false -backend-config="environments/${TF_ENVIRONMENT}.backend.hcl"

      - name: Plan
        if: steps.backend_init.outcome == 'success'
        env:
          # Must match the tags the push jobs publish.
          TF_VAR_backend_image_tag: ${{ github.sha }}
          TF_VAR_frontend_image_tag: ${{ needs.build-frontend-image.outputs.sha }}
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: terraform plan -input=false -var-file="environments/${TF_ENVIRONMENT}.tfvars" -out=tfplan

      - name: Upload plan
        if: steps.backend_init.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: my-infrastructure/tfplan
          retention-days: 1

  build-backend-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t the-achievers-backend:${{ github.sha }} .

      - name: Save image to a file
        run: docker save the-achievers-backend:${{ github.sha }} -o backend-image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar
          retention-days: 1

  build-frontend-image:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: checks
    # Fork PRs don't get FRONTEND_REPO_TOKEN, and github.token can't read the frontend repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/the-achievers-frontend
          ref: main
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Get frontend commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build docker image
        run: docker build -t the-achievers-frontend:${{ steps.sha.outputs.sha }} .

      - name: Save image to a file
        run: docker save the-achievers-frontend:${{ steps.sha.outputs.sha }} -o frontend-image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

  push-backend-image:
    name: Push backend image
    runs-on: ubuntu-latest
    needs: [terraform-plan, build-backend-image, build-frontend-image]
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'publish-image')
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME && format('{0}.azurecr.io/the-achievers-backend', secrets.ACR_NAME) || 'the-achievers-backend' }}

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load image
        run: |
          docker load -i backend-image.tar
          docker tag the-achievers-backend:${{ github.sha }} $IMAGE:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push $IMAGE:${{ github.sha }}

      - name: Tag and push latest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  push-frontend-image:
    name: Push frontend image
    runs-on: ubuntu-latest
    needs: [build-frontend-image, push-backend-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/the-achievers-frontend
      SHA: ${{ needs.build-frontend-image.outputs.sha }}

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load image
        run: |
          docker load -i frontend-image.tar
          docker tag the-achievers-frontend:$SHA $IMAGE:$SHA
          docker tag the-achievers-frontend:$SHA $IMAGE:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push --all-tags $IMAGE

  terraform-apply:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    needs: [push-frontend-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-dev
      cancel-in-progress: false
      queue: max

    defaults:
      run:
        working-directory: my-infrastructure

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: my-infrastructure

      - name: Init backend
        run: terraform init -input=false -backend-config="environments/${TF_ENVIRONMENT}.backend.hcl"

      - name: Apply
        env:
          # Ephemeral variables aren't saved in the plan file, so they must be passed again.
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan
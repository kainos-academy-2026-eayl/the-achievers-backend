name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-123456

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

  build-image:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t the-achievers-backend:${{ github.sha }} .

      - name: Save image to a file
        run: docker save the-achievers-backend:${{ github.sha }} -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  backend-image:
    name: Push backend image
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'publish-image')
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME && format('{0}.azurecr.io/the-achievers-backend', secrets.ACR_NAME) || 'the-achievers-backend' }}

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: |
          docker load -i image.tar
          docker tag the-achievers-backend:${{ github.sha }} $IMAGE:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push $IMAGE:${{ github.sha }}

      - name: Tag and push latest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    needs: backend-image
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/the-achievers-frontend

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/the-achievers-frontend
          ref: main
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Build image
        run: |
          SHA=$(git rev-parse HEAD)
          docker build -t $IMAGE:$SHA -t $IMAGE:latest .

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push --all-tags $IMAGE
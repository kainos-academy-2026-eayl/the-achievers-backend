name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Build, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-123456

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

  build-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t the-achievers-backend:${{ github.sha }} .

      - name: Save image to a file
        run: docker save the-achievers-backend:${{ github.sha }} -o image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  push-image:
    name: Push container image
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'publish-image')
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ secrets.ACR_NAME && format('{0}.azurecr.io/the-achievers-backend', secrets.ACR_NAME) || 'the-achievers-backend' }}

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: |
          docker load -i image.tar
          docker tag the-achievers-backend:${{ github.sha }} $IMAGE:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push $IMAGE:${{ github.sha }}

      - name: Tag and push latest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

  terraform-plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    defaults:
      run:
        working-directory: my-infrastructure

    env:
      ENVIRONMENT: dev
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (validation only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Init backend
        id: backend_init
        # Fork and Dependabot PRs get no secrets/OIDC, so skip the Azure steps for them
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        run: terraform init -backend-config="environments/${ENVIRONMENT}.backend.hcl"

      - name: Plan
        if: steps.backend_init.outcome == 'success'
        run: |
          terraform plan -lock-timeout=5m -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan
          {
            echo '### Terraform plan (dev)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-dev
      cancel-in-progress: false

    defaults:
      run:
        working-directory: my-infrastructure

    env:
      ENVIRONMENT: dev
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # When you add an App Service/Container App, pass the image you just pushed:
      # TF_VAR_image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Init
        run: terraform init -backend-config="environments/${ENVIRONMENT}.backend.hcl"

      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan

      - name: Apply
        run: terraform apply -lock-timeout=5m -auto-approve tfplan